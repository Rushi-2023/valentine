<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        max-width: 360px;
        width: 90vw;
        position: relative;
        z-index: 2;
    }

    img {
        width: 170px;
        height: 170px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #ff4d6d;
        margin-bottom: 15px;
    }

    h1 {
        color: #b0003a;
        margin-bottom: 8px;
        font-size: 24px;
    }

    #hint {
        font-size: 16px;
        color: #777;
        margin-bottom: 15px;
        min-height: 22px;
    }

    button {
        padding: 18px 36px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin: 10px;
        transition: all 0.3s ease;
        touch-action: manipulation;
    }

    #yesBtn {
        background: #ff4d6d;
        color: white;
        opacity: 0.6;
        cursor: not-allowed;
    }

    #yesBtn.enabled {
        opacity: 1;
        cursor: pointer;
    }

    #noBtn {
        background: #666;
        color: white;
        position: fixed;
    }

    .petal {
        position: absolute;
        font-size: 20px;
        animation: float 5s linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-100vh); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <!-- Image file must be in same folder -->
    <img src="./anime.jpg" alt="Cute Anime Valentine">

    <h1>Will you be my Valentine? 💖</h1>
    <div id="hint">You have to try a little 😉</div>

    <button id="yesBtn" disabled>YES 😍</button>
    <button id="noBtn">NO 🙄</button>

    <br>
    <button onclick="location.reload()" style="font-size:13px;opacity:0.6;">
        Reset 😅
    </button>
</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");

    const isMobile = window.matchMedia("(pointer: coarse)").matches;

    let noClicks = 0;
    let yesLocked = true;

    const messages = [
        "Hmm… are you sure? 🥺",
        "That button looks tired 😭",
        "Why are you running from love 😳",
        "Okay okay… I get it 😔"
    ];

    // 🌸 Sakura petals
    setInterval(() => {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.innerHTML = "🌸";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.fontSize = Math.random() * 20 + 12 + "px";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 5000);
    }, 500);

    // 🥺 Sad emoji trail
    function spawnSadEmoji(x, y) {
        const emoji = document.createElement("div");
        emoji.innerText = "🥺";
        emoji.style.position = "fixed";
        emoji.style.left = x + "px";
        emoji.style.top = y + "px";
        emoji.style.fontSize = "22px";
        emoji.style.opacity = "0.8";
        emoji.style.transition = "all 1s ease";
        emoji.style.pointerEvents = "none";
        document.body.appendChild(emoji);

        setTimeout(() => {
            emoji.style.transform = "translateY(-30px)";
            emoji.style.opacity = "0";
        }, 50);

        setTimeout(() => emoji.remove(), 1000);
    }

    // 😈 YES runs away when locked
    function moveYes() {
        if (!yesLocked) return;

        hint.innerText = "Not yet 😏 Try the other option...";
        yesBtn.style.position = "fixed";

        const w = yesBtn.offsetWidth;
        const h = yesBtn.offsetHeight;

        const x = Math.random() * (window.innerWidth - w - 10);
        const y = Math.random() * (window.innerHeight - h - 10);

        yesBtn.style.left = x + "px";
        yesBtn.style.top = y + "px";
    }

    yesBtn.addEventListener("mouseover", moveYes);

    if (isMobile) {
        yesBtn.addEventListener("click", (e) => {
            if (yesLocked) {
                e.preventDefault();
                moveYes();
            }
        });
    }

    // 🏃 NO button logic
    function moveNo() {
        noClicks++;

        const w = noBtn.offsetWidth;
        const h = noBtn.offsetHeight;

        const x = Math.random() * (window.innerWidth - w - 10);
        const y = Math.random() * (window.innerHeight - h - 10);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
        noBtn.style.transform = `scale(${Math.max(0.25, 1 - noClicks * 0.15)})`;

        spawnSadEmoji(x + w / 2, y + h / 2);
        hint.innerText = messages[Math.min(noClicks - 1, messages.length - 1)];

        if (noClicks >= 3) {
            yesLocked = false;
            yesBtn.disabled = false;
            yesBtn.classList.add("enabled");
            yesBtn.style.position = "static";
            hint.innerText = "Okay okay… now you can say YES 💘";
        }

        if (noClicks >= 5) {
            noBtn.style.display = "none";
        }
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("click", moveNo);

    // 💖 YES accepted
    yesBtn.addEventListener("click", () => {
        document.body.innerHTML = `
            <h1 style="color:#b0003a; font-size:28px;">
                YAY!!! 💘💘💘<br>
                Best choice ever 😘
            </h1>
        `;
    });
</script>

</body>
</html>
